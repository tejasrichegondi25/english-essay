{% extends 'base.html' %}
{% load static %}
{% block contents %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
    background-color: #0f172a !important;
    font-family: 'Inter', sans-serif !important;
    color: #f8fafc;
}

.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
    position: relative;
}

.back-btn {
    position: absolute;
    top: 40px;
    left: 40px;
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    display: flex;
    align-items: center;
}

.back-btn:hover {
    text-decoration: underline;
}

.auth-card {
    background-color: #1e293b;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid #334155;
    margin-top: 50px;
}

.auth-title {
    text-align: center;
    color: #f43f5e;
    font-weight: 700;
    font-size: 32px;
    margin-bottom: 5px;
}

.auth-subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 40px;
}

.input-label {
    color: #f8fafc;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
    text-transform: uppercase;
}

.custom-input {
    background-color: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 15px;
    width: 100%;
    color: #f8fafc;
    font-weight: 500;
    margin-bottom: 25px;
}

.custom-input:focus {
    outline: none;
    border-color: #f43f5e;
    box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.2);
}

.primary-btn {
    background-color: #f43f5e;
    color: white;
    font-weight: 700;
    font-size: 16px;
    padding: 15px;
    border-radius: 8px;
    width: 100%;
    border: none;
    cursor: pointer;
    transition: background-color 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.primary-btn:hover {
    background-color: #e11d48;
}

.msg-error {
    color: #ef4444;
    text-align: center;
    margin-top: 15px;
    font-weight: 500;
}
</style>

<div class="auth-container">
    <a href="{% url 'index' %}" class="back-btn">&larr; Back</a>
    <div class="auth-card">
        <div style="text-align:center; width:100%; position:absolute; top:-120px; left:0;">
             <h1 class="auth-title">Admin Panel</h1>
             <p class="auth-subtitle">Sign in with admin credentials</p>
        </div>

        <form action="{% url 'AdminLoginCheck' %}" method="POST">
            {% csrf_token %}
            
            <label class="input-label">ADMIN ID</label>
            <input type="text" name="loginid" class="custom-input" placeholder="admin" required>

            <label class="input-label">PASSWORD</label>
            <input type="password" name="pswd" class="custom-input" placeholder="••••••••" required>

            <button type="submit" class="primary-btn">ADMIN LOGIN</button>

            {% if messages %}
            <div class="msg-error">
                {% for message in messages %}
                <span>{{ message }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </form>
    </div>
</div>

<script>
    // Shift title to position accurately above the card
    document.querySelector('.auth-title').parentElement.style.top = (document.querySelector('.auth-card').offsetTop - 120) + 'px';
</script>
{% endblock %}
