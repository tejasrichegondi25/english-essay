{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>AI Essay Grader</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="{% static 'assets/img/favicon.png' %}" rel="icon">
  <link href="{% static 'assets/img/apple-touch-icon.png' %}" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">

  <!-- Custom Global Theme Styles -->
  <style>
    body {
        background-color: #0b0f19 !important;
        font-family: 'Inter', sans-serif !important;
        color: #f8fafc;
    }

    #header {
        background-color: #111827 !important;
        border-bottom: 1px solid #1f2937 !important;
        transition: all 0.5s;
        z-index: 997;
        padding: 15px 0;
    }

    #header .logo a {
        color: #38bdf8 !important;
        font-weight: 700;
        letter-spacing: 1px;
        text-decoration: none;
        font-family: 'Inter', sans-serif;
    }

    .navbar a {
        color: #94a3b8 !important;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        text-decoration: none;
        transition: 0.3s;
    }

    .navbar a:hover, .navbar .active {
        color: #f8fafc !important;
    }

    .navbar .getstarted, .navbar .getstarted:focus {
        background: #0ea5e9 !important;
        color: #fff !important;
        border-radius: 8px;
        font-weight: 600;
        border: none;
    }
    
    .navbar .getstarted:hover {
        background: #0284c7 !important;
    }

    /* Index/Landing Page specific overrides */
    #hero {
        background: #0f172a !important;
    }
    #hero h1 {
        color: #f8fafc !important;
        font-family: 'Inter', sans-serif !important;
        font-weight: 700;
    }
    #hero h2 {
        color: #94a3b8 !important;
        font-family: 'Inter', sans-serif !important;
    }
    .btn-get-started {
        background: #0ea5e9 !important;
        color: white !important;
        border-radius: 8px !important;
        font-family: 'Inter', sans-serif !important;
        border: none !important;
        font-weight: 600;
        padding: 10px 28px;
    }
    
    /* Ensure other text doesn't show old blue colors */
    .section-title h2 { color: #f8fafc !important; }
    .about p { color: #94a3b8 !important; }
    .about ul li { color: #cbd5e1 !important; }
  </style>

</head>

<body>

  <header id="header" class="fixed-top">
    <div class="container d-flex align-items-center">

      <h1 class="logo me-auto"><a href="{% url 'index' %}"><span>AI Essay Grader</span></a></h1>

      <nav id="navbar" class="navbar">
        <ul>
          <li><a class="nav-link scrollto" href="{% url 'index' %}">Home</a></li>
          <li><a class="nav-link scrollto" href="{% url 'AdminLogin' %}">Admin</a></li>
          <li><a class="nav-link scrollto" href="{% url 'UserLogin' %}">User Login</a></li>
          <li><a class="getstarted scrollto" href="{% url 'UserRegister' %}">Register</a></li>
        </ul>
        <i class="bi bi-list mobile-nav-toggle"></i>
      </nav>

    </div>
  </header>

{% block contents %}
{% endblock %}

  <!-- Vendor JS Files -->
  <script src="{% static 'assets/vendor/aos/aos.js' %}"></script>
  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>

</body>
</html>
