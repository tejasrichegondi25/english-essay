{% extends 'base.html' %}
{% load static %}
{% block contents %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
    background-color: #0f172a !important;
    font-family: 'Inter', sans-serif !important;
    color: #f8fafc;
}

.reg-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    min-height: 100vh;
}

.reg-card {
    background-color: #1e293b;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid #334155;
    margin-top: 30px;
}

.reg-title {
    text-align: center;
    color: #38bdf8;
    font-weight: 700;
    font-size: 28px;
    margin-bottom: 5px;
}

.reg-subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 30px;
}

.input-label {
    color: #f8fafc;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.custom-input {
    background-color: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 15px;
    width: 100%;
    color: #f8fafc;
    font-weight: 500;
    margin-bottom: 20px;
}

.custom-input::placeholder {
    color: #64748b;
}

.custom-input:focus {
    outline: none;
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
}

.row-group {
    display: flex;
    gap: 20px;
}
.row-group > div {
    flex: 1;
}

.primary-btn {
    background-color: #0ea5e9;
    color: white;
    font-weight: 700;
    font-size: 16px;
    padding: 15px;
    border-radius: 8px;
    width: 100%;
    border: none;
    cursor: pointer;
    transition: background-color 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 10px;
}

.primary-btn:hover {
    background-color: #0284c7;
}

.msg-error {
    color: #ef4444;
    text-align: center;
    margin-top: 15px;
    font-weight: 500;
}
.footer-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #94a3b8;
}

.footer-link a {
    color: #38bdf8;
    text-decoration: none;
}
</style>

<div class="reg-container">
    <div class="reg-card">
        <h1 class="reg-title">Create Account</h1>
        <p class="reg-subtitle">Join AI Essay Grader</p>

        <form action="{% url 'UserRegisterActions' %}" method="POST">
            {% csrf_token %}
            
            <label class="input-label">FULL NAME</label>
            <input type="text" name="name" class="custom-input" placeholder="Enter full name" pattern="[a-zA-Z]+" title="Only alphabets allowed" required>

            <label class="input-label">EMAIL ADDRESS</label>
            <input type="email" name="email" class="custom-input" placeholder="Enter email address" required>

            <label class="input-label">MOBILE NUMBER</label>
            <input type="text" name="mobile" class="custom-input" placeholder="Enter mobile number" pattern="[56789][0-9]{9}" title="Valid 10 digit Indian mobile number starting with 5-9" required>

            <label class="input-label">LOGIN ID</label>
            <input type="text" name="loginid" class="custom-input" placeholder="Choose a login ID" pattern="[a-zA-Z]+" title="Only alphabets allowed" required>

            <label class="input-label">PASSWORD</label>
            <input type="password" name="password" class="custom-input" placeholder="Create password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>

            <label class="input-label">LOCALITY</label>
            <input type="text" name="locality" class="custom-input" placeholder="Your locality" required>

            <label class="input-label">ADDRESS</label>
            <input type="text" name="address" class="custom-input" placeholder="Your full address" required>

            <div class="row-group">
                <div>
                    <label class="input-label">CITY</label>
                    <input type="text" name="city" class="custom-input" placeholder="City" pattern="[A-Za-z ]+" title="Enter Characters Only" required>
                </div>
                <div>
                    <label class="input-label">STATE</label>
                    <input type="text" name="state" class="custom-input" placeholder="State" pattern="[A-Za-z ]+" title="Enter Characters Only" required>
                </div>
            </div>

            <input type="hidden" name="status" value="waiting">

            <button type="submit" class="primary-btn">REGISTER</button>

            {% if messages %}
            <div class="msg-error">
                {% for message in messages %}
                <span>{{ message }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </form>

        <div class="footer-link">
            Already have an account? <a href="{% url 'UserLogin' %}">Login</a>
        </div>
    </div>
</div>
{% endblock %}
