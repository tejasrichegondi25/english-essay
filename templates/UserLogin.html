{% extends 'base.html' %}
{% load static %}
{% block contents %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
    background-color: #0f172a !important;
    font-family: 'Inter', sans-serif !important;
    color: #f8fafc;
}

.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
}

.auth-card {
    background-color: #1e293b;
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid #334155;
    margin-top: 50px;
}

.auth-title {
    text-align: center;
    color: #38bdf8;
    font-weight: 700;
    font-size: 28px;
    margin-bottom: 5px;
}

.auth-subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 30px;
}

.input-label {
    color: #f8fafc;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
    text-transform: uppercase;
}

.custom-input {
    background-color: #e2e8f0;
    border: none;
    border-radius: 8px;
    padding: 15px;
    width: 100%;
    color: #0f172a;
    font-weight: 500;
    margin-bottom: 20px;
}

.custom-input:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.5);
}

.primary-btn {
    background-color: #0ea5e9;
    color: white;
    font-weight: 700;
    font-size: 16px;
    padding: 15px;
    border-radius: 8px;
    width: 100%;
    border: none;
    cursor: pointer;
    transition: background-color 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.primary-btn:hover {
    background-color: #0284c7;
}

.footer-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #94a3b8;
}

.footer-link a {
    color: #38bdf8;
    text-decoration: none;
}

.footer-link a:hover {
    text-decoration: underline;
}

.admin-link {
    color: #f43f5e !important;
    margin-top: 10px;
    display: block;
    text-align: center;
}
</style>

<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">AI Essay Grader</h1>
        <p class="auth-subtitle">Sign in to continue</p>

        <form action="{% url 'UserLoginCheck' %}" method="POST">
            {% csrf_token %}
            
            <label class="input-label">LOGIN ID</label>
            <input type="text" name="loginid" class="custom-input" placeholder="tejasri" required>

            <label class="input-label">PASSWORD</label>
            <input type="password" name="pswd" class="custom-input" placeholder="••••••••" required>

            <button type="submit" class="primary-btn">LOGIN</button>

            {% if messages %}
            <div style="margin-top: 15px; text-align: center;">
                {% for message in messages %}
                <span style="color: #ef4444; font-weight: 500;">{{ message }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </form>

        <div class="footer-link">
            Don't have an account? <a href="{% url 'UserRegister' %}">Register</a>
            <br>
            <a href="{% url 'AdminLogin' %}" class="admin-link">Administrator Login</a>
        </div>
    </div>
</div>
{% endblock %}
